name: Product bug
description: Report a reproducible product or documentation problem.
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the affected feature and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a non-sensitive test case. Remove credentials and private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or client version
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed secrets and private workspace information.
          required: true
